name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching Cargo.toml and the Mac app
        required: true
        default: v0.2.2

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
          - platform: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RUSTUP_TOOLCHAIN: 1.99.0-${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "13.3"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release metadata
        run: python3 scripts/github-release.py validate --tag "$RELEASE_TAG"
      - name: Install Rust
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          rustc -vV
      - name: Build the browser host
        run: cargo build --locked --release
      - name: Test the host
        run: cargo test --locked --release -- --test-threads=1
      - name: Build the Mac application
        if: runner.os == 'macOS'
        run: |
          sh scripts/build-desktop.sh
          mkdir -p target/native-tests
          swiftc desktop/macos/Policy.swift desktop/macos/PolicyCheck.swift -o target/native-tests/policy-check
          target/native-tests/policy-check
      - name: Package and test the extracted download
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/github-release.py package --tag "$RELEASE_TAG" --platform "$RELEASE_PLATFORM"
      - name: Upload tested download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: target/github-release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: target/github-release
          merge-multiple: true
      - name: Verify inventory and generate checksums
        run: python3 scripts/github-release.py checksums --tag "$RELEASE_TAG"
      - name: Publish the tested downloads
        run: |
          version=$(python3 scripts/github-release.py validate --tag "$RELEASE_TAG")
          gh release create "$RELEASE_TAG" target/github-release/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Nimlo $version" --notes-file "releases/$version.md" --latest
