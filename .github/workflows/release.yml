name: Release Nimlo

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching the app and workspace host
        required: true
        default: v0.3.0

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RUSTUP_TOOLCHAIN: 1.99.0-aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: '13.3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Validate release metadata
        run: |
          python3 - <<'PY'
          import os, pathlib, plistlib, re, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          native = plistlib.loads(pathlib.Path('desktop/neovim/Info.plist').read_bytes())
          assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', os.environ['RELEASE_TAG'])
          assert os.environ['RELEASE_TAG'] == 'v' + version
          assert native['CFBundleShortVersionString'] == version
          assert native['CFBundleName'] == 'Nimlo'
          assert pathlib.Path(f'releases/{version}.md').is_file()
          PY
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Test the workspace host
        run: cargo test --release --locked -- --test-threads=1
      - name: Build the native Neovim app
        run: make build
      - name: Verify the bundled engine and package
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          app = pathlib.Path('target/desktop/Nimlo.app/Contents')
          expected = json.loads(pathlib.Path('neovim-release.json').read_text())['version']
          output = subprocess.check_output([str(app/'Resources/neovim/bin/nvim'), '--version'], text=True)
          assert output.splitlines()[0] == 'NVIM v' + expected
          subprocess.run([str(app/'Resources/nimlo-host'), '--help'], check=True)
          subprocess.run(['codesign', '--verify', '--deep', '--strict', str(app.parent)], check=True)
          PY
          target/desktop/Nimlo.app/Contents/Resources/neovim/bin/nvim --headless -u NONE -i NONE --noplugin -l scripts/neovim-runtime-check.lua
          make package
          cd target/packages
          shasum -a 256 Nimlo-*-macos-arm64.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Nimlo-macos-arm64
          path: |
            target/packages/Nimlo-*-macos-arm64.zip
            target/packages/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Nimlo-macos-arm64
          path: release
      - name: Publish Nimlo
        run: |
          version="${RELEASE_TAG#v}"
          test -f "release/Nimlo-$version-macos-arm64.zip"
          (cd release && sha256sum -c SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" "release/Nimlo-$version-macos-arm64.zip" release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Nimlo $version" --notes-file "releases/$version.md" --latest
