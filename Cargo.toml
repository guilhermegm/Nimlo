[package]
name = "nimlo-editor"
version = "0.2.2"
edition = "2024"
description = "Nimlo: a lightweight code editor with a shared workspace, terminal and AI"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal", "time", "process", "io-util", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
argon2 = "0.5.3"
rand = "0.9"
fs2 = "0.4"
portable-pty = "0.9"
vt100 = "0.16"
libc = "0.2"
if-addrs = "0.14"
subtle = "2.6"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["service", "tokio"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

